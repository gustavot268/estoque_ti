# Scripts de instalação explicitamente revisados (requisito 14.16 — cadeia de fornecimento).
# Somente pacotes cujo script de pós-instalação é necessário ficam habilitados.
allowBuilds:
  # Prisma precisa baixar/posicionar os binários do schema engine para `prisma migrate`.
  '@prisma/engines': true
  prisma: true
  # esbuild (via tsx) compila o binário nativo usado pelo seed e pelos scripts TypeScript.
  esbuild: true
  # Não são necessários: a otimização de imagens do Next não é usada nesta etapa.
  sharp: false
  unrs-resolver: false
# Correções de segurança em dependências transitivas cujo pacote de origem ainda fixa a versão
# vulnerável (`pnpm audit`, docs/revisao-de-seguranca.md item 16). Cada uma só age sobre as
# versões vulneráveis; remover quando o pacote de origem passar a trazer a versão corrigida.
overrides:
  # @prisma/config fixa effect 3.20.0 (GHSA-7589-6fvf-x4pw); mesma major.
  'effect@<3.22.1': ^3.22.1
  # @prisma/dev > ajv (GHSA-hrr3-gc8f-f4qj, GHSA-w74x-v6f9-j3xg e outros); mesma major.
  'fast-uri@<3.1.9': ^3.1.9
  # next > postcss (GHSA-68fv-2mgg-jv7q); mesma major.
  'source-map-js@<1.2.2': ^1.2.2
  # vitest > vite, só de teste (GHSA-587h-7wmj-h5pm e outros); o lockfile mantinha a 8.3.0.
  'vite@<8.3.3': ^8.3.3
  # exceljs 4.4.0 (a mais recente) pede uuid ^8 (GHSA-w5hq-g745-h8pq). A falha é em v3/v5/v6 com
  # buffer; o exceljs só usa `v4` via `require`, que a 11 mantém. Exportação coberta por testes.
  'exceljs>uuid': ^11.1.1
